<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse & Search — Auction Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .search-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      padding: 2rem 0 4rem 0;
    }
    .filter-panel {
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      height: fit-content;
    }
    .filter-section {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .filter-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .filter-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 0.75rem;
    }
    .filter-checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--color-text-main);
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .filter-price-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .search-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .search-count {
      font-size: 0.95rem;
      color: var(--color-text-muted);
    }
    .sort-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
    }
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
    }
    @media (max-width: 768px) {
      .search-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 6 12 12 16 14"></polygon>
        </svg>
        <span>Auction<span class="logo-highlight">Hub</span></span>
      </a>

      <!-- Search Bar with inline AI Toggle -->
      <form class="nav-search-bar" id="navbar-search-form" onsubmit="executeSearchForm(event)">
        <button type="button" class="ai-toggle-btn" id="nav-ai-toggle" onclick="toggleNavAiMode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
          <span id="ai-toggle-label">Ask AI</span>
        </button>
        <input type="text" id="nav-search-input" placeholder="Search items...">
        <button type="submit" class="search-submit-btn" aria-label="Submit search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </form>

      <div class="nav-actions">
        <a href="/wishlist.html" class="nav-icon-btn" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </a>
        <a href="/cart.html" class="nav-icon-btn" aria-label="Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </a>
        <a href="/seller/create.html" class="btn-sell">+ Sell Item</a>
        <div id="nav-auth-container" class="nav-actions">
          <a href="/login.html" class="nav-link">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- AI Search Interpretation Banner (Shown if AI Query used) -->
    <div id="ai-search-interpretation" class="ai-panel" style="display: none;">
      <div class="ai-panel-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span class="ai-badge">AI Natural Search</span>
          <span id="ai-query-text" style="font-weight: 600; font-size: 0.95rem;"></span>
        </div>
        <button class="btn btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.78rem;" onclick="resetToPlainSearch()">Reset to standard search</button>
      </div>
      <div id="ai-extracted-filters" style="font-size: 0.85rem; color: var(--color-text-muted);">
        Extracted criteria will appear here.
      </div>
    </div>

    <div class="search-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--color-primary);">Filters</h3>
          <button onclick="clearAllFilters()" style="font-size: 0.8rem; color: var(--color-error); font-weight: 600;">Clear All</button>
        </div>

        <!-- Listing Type -->
        <div class="filter-section">
          <h4 class="filter-title">Listing Format</h4>
          <label class="filter-checkbox-label">
            <input type="radio" name="filter_listing_type" value="" checked onchange="applyFilters()">
            <span>All Listings</span>
          </label>
          <label class="filter-checkbox-label">
            <input type="radio" name="filter_listing_type" value="buy_now" onchange="applyFilters()">
            <span>Buy Now Deals</span>
          </label>
          <label class="filter-checkbox-label">
            <input type="radio" name="filter_listing_type" value="auction" onchange="applyFilters()">
            <span>⚡ Live Auctions</span>
          </label>
        </div>

        <!-- Category -->
        <div class="filter-section">
          <h4 class="filter-title">Category</h4>
          <select id="filter-category" class="form-control" onchange="applyFilters()">
            <option value="">All Categories</option>
          </select>
        </div>

        <!-- Price Range -->
        <div class="filter-section">
          <h4 class="filter-title">Price Range (₹)</h4>
          <div class="filter-price-row">
            <input type="number" id="filter-min-price" class="form-control" placeholder="Min" min="0" onchange="applyFilters()">
            <span>-</span>
            <input type="number" id="filter-max-price" class="form-control" placeholder="Max" min="0" onchange="applyFilters()">
          </div>
        </div>

        <!-- Condition -->
        <div class="filter-section">
          <h4 class="filter-title">Condition</h4>
          <label class="filter-checkbox-label"><input type="checkbox" class="condition-cb" value="new" onchange="applyFilters()"> New</label>
          <label class="filter-checkbox-label"><input type="checkbox" class="condition-cb" value="like_new" onchange="applyFilters()"> Like New</label>
          <label class="filter-checkbox-label"><input type="checkbox" class="condition-cb" value="good" onchange="applyFilters()"> Good</label>
          <label class="filter-checkbox-label"><input type="checkbox" class="condition-cb" value="fair" onchange="applyFilters()"> Fair</label>
          <label class="filter-checkbox-label"><input type="checkbox" class="condition-cb" value="poor" onchange="applyFilters()"> Poor</label>
        </div>
      </aside>

      <!-- Main Results Column -->
      <section>
        <div class="search-top-bar">
          <div class="search-count" id="results-count-label">Loading items...</div>
          <div class="sort-control">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="form-control" style="width: auto; padding: 0.35rem 0.75rem;" onchange="applyFilters()">
              <option value="newest">Newest Listed</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="ending_soon">Auctions: Ending Soon</option>
            </select>
          </div>
        </div>

        <div class="product-grid" id="search-results-grid">
          <!-- Populated by JS -->
        </div>

        <div class="pagination-bar" id="pagination-controls" style="display: none;">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let isNavAi = false;
    let currentPage = 1;
    let categoriesList = [];

    function toggleNavAiMode() {
      isNavAi = !isNavAi;
      document.getElementById('nav-ai-toggle').classList.toggle('active', isNavAi);
      document.getElementById('nav-search-input').placeholder = isNavAi
        ? "Ask AI in natural language..."
        : "Search items...";
    }

    function executeSearchForm(e) {
      e.preventDefault();
      const q = document.getElementById('nav-search-input').value.trim();
      const urlParams = new URLSearchParams(window.location.search);
      if (isNavAi) {
        urlParams.delete('q');
        urlParams.set('ai_query', q);
      } else {
        urlParams.delete('ai_query');
        urlParams.set('q', q);
      }
      urlParams.set('page', '1');
      window.location.search = urlParams.toString();
    }

    async function loadCategories() {
      try {
        categoriesList = await API.get('/api/categories');
        const select = document.getElementById('filter-category');
        select.innerHTML = '<option value="">All Categories</option>' + categoriesList.map(c => 
          `<option value="${c.slug}">${escapeHtml(c.name)}</option>`
        ).join('');
      } catch (e) {}
    }

    async function fetchResults() {
      const urlParams = new URLSearchParams(window.location.search);
      const q = urlParams.get('q') || '';
      const aiQuery = urlParams.get('ai_query');
      const category = urlParams.get('category') || '';
      const listingType = urlParams.get('listing_type') || '';
      const condition = urlParams.get('condition') || '';
      const minPrice = urlParams.get('min_price') || '';
      const maxPrice = urlParams.get('max_price') || '';
      const sortBy = urlParams.get('sort_by') || 'newest';
      currentPage = parseInt(urlParams.get('page') || '1');

      // Hydrate inputs
      if (q) document.getElementById('nav-search-input').value = q;
      if (category) document.getElementById('filter-category').value = category;
      if (minPrice) document.getElementById('filter-min-price').value = minPrice;
      if (maxPrice) document.getElementById('filter-max-price').value = maxPrice;
      document.getElementById('sort-select').value = sortBy;
      
      const typeRadio = document.querySelector(`input[name="filter_listing_type"][value="${listingType}"]`);
      if (typeRadio) typeRadio.checked = true;

      // Handle AI Query if present
      if (aiQuery) {
        document.getElementById('ai-search-interpretation').style.display = 'block';
        document.getElementById('ai-query-text').textContent = `"${aiQuery}"`;
        document.getElementById('nav-search-input').value = aiQuery;
        isNavAi = true;
        document.getElementById('nav-ai-toggle').classList.add('active');
        
        try {
          const aiRes = await API.post('/api/ai/natural-search', { query: aiQuery });
          if (aiRes.filters) {
            document.getElementById('ai-extracted-filters').innerHTML = `
              <strong>Extracted Criteria:</strong> Category: <em>${aiRes.filters.category || 'Any'}</em> | Max Budget: <em>${aiRes.filters.budget_max ? '₹' + aiRes.filters.budget_max : 'None'}</em> | Condition: <em>${aiRes.filters.condition || 'Any'}</em>
            `;
            renderGrid(aiRes.results || []);
            document.getElementById('results-count-label').textContent = `Showing ${aiRes.results ? aiRes.results.length : 0} matching items`;
            return;
          }
        } catch (err) {
          // Graceful fallback to keyword search per 03_AppFlow.md
          console.warn("AI natural search fallback:", err);
        }
      } else {
        document.getElementById('ai-search-interpretation').style.display = 'none';
      }

      // Standard API Call
      const params = {
        q: q || (aiQuery || ''),
        category,
        listing_type: listingType,
        condition,
        min_price: minPrice,
        max_price: maxPrice,
        sort_by: sortBy,
        page: currentPage,
        limit: 12
      };

      try {
        const data = await API.get('/api/products', params);
        renderGrid(data.items || []);
        document.getElementById('results-count-label').textContent = `Showing ${data.items ? data.items.length : 0} of ${data.total} items`;
        renderPagination(data.total_pages, currentPage);
      } catch (err) {
        document.getElementById('search-results-grid').innerHTML = `
          <div style="grid-column: 1 / -1; padding: 3rem; text-align: center; color: var(--color-text-muted);">
            <h3>Error loading listings</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('search-results-grid');
      if (!items || items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 4rem 2rem; text-align: center; background: #FFFFFF; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-light)" stroke-width="1.5" style="margin-bottom: 1rem;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <h3 style="font-size: 1.25rem; color: var(--color-primary); margin-bottom: 0.5rem;">No listings found</h3>
            <p style="color: var(--color-text-muted); max-width: 400px; margin: 0 auto 1.5rem auto;">Try broadening your filters, checking for spelling errors, or searching with different keywords.</p>
            <button class="btn btn-outline" onclick="clearAllFilters()">Reset All Filters</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(p => {
        const isAuction = p.listing_type === 'auction';
        const imageSrc = (p.images && p.images[0]?.storage_path) ? p.images[0].storage_path : 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop&q=80';
        
        if (isAuction && p.auction) {
          const timeInfo = formatTimeRemaining(p.auction.end_time);
          return `
            <article class="card auction-card">
              <div class="card-image-wrap">
                <img src="${imageSrc}" alt="${escapeHtml(p.title)}" class="card-image" loading="lazy">
                <div class="card-badge-container">
                  <span class="badge badge-auction">Auction</span>
                  ${timeInfo.endingSoon ? '<span class="badge badge-ending-soon">Ending Soon</span>' : ''}
                  <span class="badge badge-condition">${escapeHtml(p.condition.replace('_', ' '))}</span>
                </div>
              </div>
              <div class="card-body">
                <div class="card-brand">${escapeHtml(p.brand || 'General')}</div>
                <h3 class="card-title"><a href="/product.html?id=${p.id}">${escapeHtml(p.title)}</a></h3>
                <div class="card-meta">
                  <div class="card-auction-row">
                    <div class="auction-bid-info">
                      <span class="auction-current-bid">${formatCurrency(p.auction.current_bid || p.auction.starting_bid)}</span>
                      <span class="auction-bid-count">${p.auction.bid_count} bids</span>
                    </div>
                    <div class="auction-timer">${timeInfo.text}</div>
                  </div>
                </div>
              </div>
            </article>
          `;
        }

        return `
          <article class="card">
            <div class="card-image-wrap">
              <img src="${imageSrc}" alt="${escapeHtml(p.title)}" class="card-image" loading="lazy">
              <div class="card-badge-container">
                <span class="badge badge-buy-now">Buy Now</span>
                <span class="badge badge-condition">${escapeHtml(p.condition.replace('_', ' '))}</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-brand">${escapeHtml(p.brand || 'General')}</div>
              <h3 class="card-title"><a href="/product.html?id=${p.id}">${escapeHtml(p.title)}</a></h3>
              <div class="card-meta">
                <div class="card-price-row">
                  <span class="card-price">${formatCurrency(p.price)}</span>
                  <span class="card-seller-rating"><span class="rating-star">★</span> ${p.seller_rating ? p.seller_rating.toFixed(1) : '5.0'}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderPagination(totalPages, page) {
      const bar = document.getElementById('pagination-controls');
      if (totalPages <= 1) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      let html = '';
      if (page > 1) {
        html += `<button class="btn btn-outline" onclick="goToPage(${page - 1})">&larr; Prev</button>`;
      }
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="btn ${i === page ? 'btn-primary' : 'btn-outline'}" style="min-width: 38px; padding: 0.4rem 0.75rem;" onclick="goToPage(${i})">${i}</button>`;
      }
      if (page < totalPages) {
        html += `<button class="btn btn-outline" onclick="goToPage(${page + 1})">Next &rarr;</button>`;
      }
      bar.innerHTML = html;
    }

    function goToPage(p) {
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.set('page', p);
      window.location.search = urlParams.toString();
    }

    function applyFilters() {
      const urlParams = new URLSearchParams(window.location.search);
      const cat = document.getElementById('filter-category').value;
      const type = document.querySelector('input[name="filter_listing_type"]:checked')?.value || '';
      const minP = document.getElementById('filter-min-price').value;
      const maxP = document.getElementById('filter-max-price').value;
      const sortBy = document.getElementById('sort-select').value;
      
      const conditions = Array.from(document.querySelectorAll('.condition-cb:checked')).map(cb => cb.value).join(',');

      if (cat) urlParams.set('category', cat); else urlParams.delete('category');
      if (type) urlParams.set('listing_type', type); else urlParams.delete('listing_type');
      if (minP) urlParams.set('min_price', minP); else urlParams.delete('min_price');
      if (maxP) urlParams.set('max_price', maxP); else urlParams.delete('max_price');
      if (conditions) urlParams.set('condition', conditions); else urlParams.delete('condition');
      urlParams.set('sort_by', sortBy);
      urlParams.set('page', '1');

      window.location.search = urlParams.toString();
    }

    function clearAllFilters() {
      window.location.href = '/search.html';
    }

    function resetToPlainSearch() {
      const urlParams = new URLSearchParams(window.location.search);
      const aiQ = urlParams.get('ai_query');
      urlParams.delete('ai_query');
      if (aiQ) urlParams.set('q', aiQ);
      window.location.search = urlParams.toString();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadCategories();
      await fetchResults();
    });
  </script>
</body>
</html>
