<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Auction Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-md);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.65rem;
      color: var(--color-primary);
      margin-bottom: 0.35rem;
    }
    .auth-header p {
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 6 12 12 16 14"></polygon>
        </svg>
        <span>Auction<span class="logo-highlight">Hub</span></span>
      </a>
      <a href="/" class="nav-link">&larr; Back to Marketplace</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your buyer & seller account</p>
      </div>

      <div id="auth-error-alert" style="display: none; background-color: var(--color-error-bg); border-left: 4px solid var(--color-error); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.88rem; color: var(--color-error);"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="req">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="login-password">Password <span class="req">*</span></label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--color-text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--color-primary); font-weight: 600;">Create an account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (API.isAuthenticated()) {
      window.location.href = '/';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');
      const alert = document.getElementById('auth-error-alert');

      alert.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await API.login(email, password);
        showToast('Signed in successfully!', 'success');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/';
        setTimeout(() => window.location.href = redirect, 500);
      } catch (err) {
        alert.textContent = err.message || 'Invalid email or password.';
        alert.style.display = 'block';
        showToast(err.message || 'Login failed', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
